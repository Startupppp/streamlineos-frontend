name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/backend.yml
  pull_request:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/backend.yml

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: streamlineos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d streamlineos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://user:password@localhost:5432/streamlineos
      BACKEND_JWT_SECRET: ci-only-backend-jwt-secret-with-at-least-44-characters
      PORTAL_JWT_SECRET: ci-only-portal-jwt-secret-with-at-least-44-characters-xx
      ENCRYPTION_KEY: ci-only-encryption-key-min-32-characters-for-testing
      CORS_ORIGINS: http://localhost:1000
      APP_URL: http://localhost:1000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm typecheck

      - name: Spec-inclusive Type Check
        run: pnpm check:spec-typecheck:self-test && pnpm check:spec-typecheck

      - name: Placement Bypass Guard Self-Test
        run: pnpm check:placement-bypass:self-test

      - name: Placement Bypass Guard
        run: pnpm check:placement-bypass

      - name: Owner Authority Guard Self-Test
        run: pnpm check:owner-authority:self-test

      - name: Owner Authority Guard
        run: pnpm check:owner-authority

      - name: OpenAPI Contract Self-Test
        run: pnpm openapi:check:self-test

      - name: OpenAPI Contract Freshness
        run: pnpm openapi:check

      - name: Request-Schema Coverage Self-Test
        run: pnpm check:openapi-coverage:self-test

      - name: Request-Schema Coverage Thresholds
        run: pnpm check:openapi-coverage

      - name: Bodyless Conflicts Self-Test
        run: pnpm check:bodyless-conflicts:self-test

      - name: Bodyless Conflicts
        run: pnpm check:bodyless-conflicts

      - name: Operation IDs are unique
        run: pnpm check:operation-ids:self-test && pnpm check:operation-ids

      - name: Migration Discipline
        run: pnpm check:migration-discipline

      - name: Feature Flag Governance
        run: pnpm check:feature-flag-governance:self-test && pnpm check:feature-flag-governance

      - name: Files over 300 lines do not increase
        run: pnpm check:over-300:self-test && pnpm check:over-300

      - name: Offset, unbounded and unordered reads do not increase
        run: pnpm check:unbounded-reads:self-test && pnpm check:unbounded-reads

      - name: HR table freeze
        run: pnpm check:hr-table-freeze:self-test && pnpm check:hr-table-freeze

      - name: Unit Tests
        run: pnpm test -- --runInBand

      - name: Bootstrap Test Database
        run: pnpm db:bootstrap

      - name: Migration ledger agrees with the journal
        run: pnpm check:migration-ledger:self-test && pnpm check:migration-ledger

      - name: Controller E2E Tests
        run: pnpm test:e2e:ci

      - name: Build
        run: pnpm build

      # Release artifacts. The SBOM and the artifact hash manifest are retained with the
      # build so a shipped binary can be traced back to the dependency set it was built from.
      - name: Generate SBOM
        run: pnpm sbom:generate:self-test && pnpm sbom:generate

      - name: Record artifact hashes
        run: pnpm artifact:record-hashes

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: backend/sbom.json
          retention-days: 90

      - name: Upload artifact hash manifest
        uses: actions/upload-artifact@v4
        with:
          name: artifact-hashes-${{ github.sha }}
          path: backend/artifact-hashes.json
          retention-days: 90

      - name: Build Container
        working-directory: .
        run: docker build -f backend/Dockerfile backend

  migration-proof:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: streamlineos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d streamlineos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://user:password@localhost:5432/streamlineos
      PGSSLMODE: disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Run the complete migration chain twice from disposable databases: once from
      # zero and once split at the supported upgrade watermark. The proof compares the
      # full catalog and drops both probes in a finally block.
      - name: Cold bootstrap and supported-upgrade catalog proof
        run: pnpm migration:proof

  txn-ceiling:
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: streamlineos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d streamlineos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://user:password@localhost:5432/streamlineos
      BACKEND_JWT_SECRET: ci-only-backend-jwt-secret-with-at-least-44-characters
      PORTAL_JWT_SECRET: ci-only-portal-jwt-secret-with-at-least-44-characters-xx
      ENCRYPTION_KEY: ci-only-encryption-key-min-32-characters-for-testing
      INTERNAL_API_SECRET: ci-only-internal-api-secret-min-32-chars-for-testing
      CORS_ORIGINS: http://localhost:1000
      APP_URL: http://localhost:1000
      PORT: "1500"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Bootstrap Database
        run: pnpm db:bootstrap

      - name: Seed Probe Actor
        run: |
          psql "$DATABASE_URL" -c "INSERT INTO users (id, email) VALUES ('ci-txn-probe', 'txn-probe@ci.internal')"
          psql "$DATABASE_URL" -c "INSERT INTO organizations (id, name, slug, owner_membership_id) VALUES ('ci-txn-probe-org', 'CI Txn Probe', 'ci-txn-probe', 0)"
          psql "$DATABASE_URL" -c "INSERT INTO organization_members (user_id, org_id, role, is_owner, status) VALUES ('ci-txn-probe', 'ci-txn-probe-org', 'MEMBER', false, 'ACTIVE')"
          psql "$DATABASE_URL" -c "UPDATE organizations SET owner_membership_id = (SELECT id FROM organization_members WHERE user_id = 'ci-txn-probe' LIMIT 1) WHERE id = 'ci-txn-probe-org'"

      - name: Build API
        run: pnpm build

      - name: Start API
        run: pnpm start:prod &

      - name: Wait for API Health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:1500/health > /dev/null 2>&1; then
              echo "API is ready after ${i} probes"
              exit 0
            fi
            echo "Probe $i/30 — not yet ready, sleeping 2s"
            sleep 2
          done
          echo "API did not become healthy within 60s" >&2
          exit 1

      - name: Check Request Transaction Ceiling
        run: pnpm db:check-request-txn

  build-read-ceiling:
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: streamlineos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d streamlineos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://user:password@localhost:5432/streamlineos
      APP_DATABASE_URL: postgres://streamline_app:ci-app-password@localhost:5432/streamlineos
      APP_DB_PASSWORD: ci-app-password
      PGSSLMODE: disable
      SEED_ORG_ID: ci-build-probe-org
      SEED_NEIGHBOUR_ORG_ID: ci-build-neighbour-org
      SEED_TICKETS: "20000"
      SEED_PROJECTS: "4"
      SEED_COMMENTS: "0"
      SEED_ACTIVITY: "0"
      SEED_RELATIONS: "0"
      SEED_TIMESHEETS: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Bootstrap Database
        run: pnpm db:bootstrap

      - name: Create App Role
        run: pnpm db:bootstrap-role

      - name: Seed Probe Orgs
        run: |
          psql "$DATABASE_URL" -c "INSERT INTO users (id, email) VALUES ('ci-build-probe', 'build-probe@ci.internal')"
          psql "$DATABASE_URL" -c "INSERT INTO organizations (id, name, slug, owner_membership_id) VALUES ('ci-build-probe-org', 'CI Build Probe', 'ci-build-probe', 0)"
          psql "$DATABASE_URL" -c "INSERT INTO organization_members (user_id, org_id, role, is_owner, status) VALUES ('ci-build-probe', 'ci-build-probe-org', 'MEMBER', false, 'ACTIVE')"
          psql "$DATABASE_URL" -c "UPDATE organizations SET owner_membership_id = (SELECT id FROM organization_members WHERE user_id = 'ci-build-probe' LIMIT 1) WHERE id = 'ci-build-probe-org'"
          psql "$DATABASE_URL" -c "INSERT INTO users (id, email) VALUES ('ci-build-neighbour', 'build-neighbour@ci.internal')"
          psql "$DATABASE_URL" -c "INSERT INTO organizations (id, name, slug, owner_membership_id) VALUES ('ci-build-neighbour-org', 'CI Neighbour', 'ci-build-neighbour', 0)"
          psql "$DATABASE_URL" -c "INSERT INTO organization_members (user_id, org_id, role, is_owner, status) VALUES ('ci-build-neighbour', 'ci-build-neighbour-org', 'MEMBER', false, 'ACTIVE')"
          psql "$DATABASE_URL" -c "UPDATE organizations SET owner_membership_id = (SELECT id FROM organization_members WHERE user_id = 'ci-build-neighbour' LIMIT 1) WHERE id = 'ci-build-neighbour-org'"

      - name: Seed Build Load
        run: pnpm seed:build-load

      - name: Budget Guard Self-Test
        run: pnpm db:check-read-budgets:self-test

      - name: Check Build Read Ceiling
        run: pnpm db:check-read-budgets:build
