name: Frontend CI/CD

# 2026-09-02 (ticket 35b) — the gates moved out of the `frontend` job into their
# own `gates` job. Measured on run 33622293615: `frontend` failed at step 6
# (Lint) and every one of the 10 gate steps below it reported `-`, i.e. never
# executed. A gate sequenced after a red step is not a gate. `gates` carries no
# `needs:`, so a lint regression can no longer mask the enforcement surface.

on:
  push:
    branches:
      - main
    paths:
      - frontend/**
      - .github/workflows/frontend.yml
  pull_request:
    branches:
      - main

jobs:
  # 2026-09-02 (ticket 36) — `Type Check` and `Build` used to sit in this job
  # BELOW `Lint`, which is the same masking defect 35b fixed for `gates` and 35
  # fixed for `tests`, one costume further down. Lint is red, so neither the
  # frontend type check nor the frontend build had ever executed in CI: both
  # reported `-`. They are now their own jobs, each with no `needs:`.
  #
  # This job is therefore Lint and nothing else. Its id is left as `frontend`,
  # unrenamed, so any branch-protection rule naming that check still resolves.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

  # No `needs:`. Measured at head through the release mutex: `pnpm run
  # type-check` (tsc --noEmit) exit 0, 0 errors. It needs no environment.
  type-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm run type-check

  # No `needs:`. The env block is NOT decoration: `next build` runs with
  # NODE_ENV=production, and `frontend/lib/env.ts` parses process.env at import
  # from `app/layout.tsx` and THROWS in production when it fails. Measured with
  # the schema in isolation under a scrubbed environment:
  #   - NODE_ENV=production, neither variable set -> FAILS on NEXTAUTH_SECRET
  #     and NEXT_PUBLIC_API_URL, "would THROW at build". That is the state this
  #     step was in, which the Lint mask had been hiding.
  #   - the secret alone (the shape the deleted frontend/.github copies used)
  #     -> still FAILS on NEXT_PUBLIC_API_URL.
  #   - both, as below -> PASSES.
  # The secret is a build-only placeholder, never a real credential; it is 50
  # characters because lib/env.ts requires >= 44 in production.
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          # 2026-09-03 — `next build` died with "Ineffective mark-compacts near
          # heap limit" on run 33718207435. The runner's default heap is ~2GB and
          # the build reached it; ubuntu-latest has 16GB of RAM, so 8GB is safe.
          NODE_OPTIONS: --max-old-space-size=8192
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-build-only-placeholder-not-a-real-secret-abc123' }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'http://localhost:3000' }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:1500' }}

  # The unit suite, in its OWN job for exactly the reason `gates` is in its own
  # job. 2026-09-02 (ticket 35): `Run Tests` sat below `Lint` inside `frontend`,
  # and `Lint` is red, so the suite had never executed in CI either — the same
  # masking defect 35b found for the gates, one step lower down. A suite whose
  # result is "-" is not a passing suite.
  #
  # Unfiltered on purpose. `jest --testPathPattern=<x>` reports green while every
  # suite outside the filter is red, which is the false pass this job exists to
  # make impossible.
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # 2026-09-03 — the `tests` job had NO env at all, while `build` has carried
      # NEXTAUTH_SECRET/NEXT_PUBLIC_API_URL since it was split out. Five suites
      # therefore failed at MODULE LOAD, not on an assertion:
      # `components/ai/ai-error-state.ts:19` throws "NEXT_PUBLIC_API_URL is not
      # set" when it is imported. Measured on run 33718207435. The placeholder
      # is local-only and is never a real credential; NEXTAUTH_SECRET must be
      # >= 44 chars or `lib/env.ts` rejects it.
      - name: Run Tests
        run: pnpm test --runInBand
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-test-only-placeholder-not-a-real-secret-abc123' }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:1500' }}

  # Every static gate in the frontend package. Hermetic: no database, no
  # network, no sibling checkout. A step marked `continue-on-error` names the
  # measured reason it cannot block yet — a gate wired so that it always fails
  # gets muted within a week, which is worse than not wiring it.
  #
  # 2026-09-03 (ticket 35) — EVERY gate step carries `if: ${{ !cancelled() }}`.
  # Without it a single red gate skips every gate below it, so the job reports
  # on a PREFIX of the suite rather than on the suite. Measured at head in a
  # frontend-only checkout: `check:command-catalog` is red for a real reason,
  # and it alone turned the 18 gates after it into "skipped". The condition
  # does NOT weaken anything — a failed step without continue-on-error still
  # fails the job, it simply no longer hides its successors.
  gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # 2026-09-03 (ticket 35) — MEASURED: this step exited 1 in a frontend-only
      # checkout ("3 failed, 15 passed"), and as the FIRST step of this job it
      # would have skipped all 26 gate steps below it. 35b moved the gates out
      # from under a red Lint; this was the same masking defect one step lower,
      # and it made the whole `gates` job a badge over nothing.
      # Four of its 18 assertions need the backend repository checked out
      # beside this one, which this job deliberately does not do (see the
      # header). Those four are now reported NOT RUN and the run ends
      # INCONCLUSIVE (exit 2); the opt-in below downgrades that to a labelled
      # PARTIAL (exit 0). The step stays BLOCKING because the opt-in does not
      # mask a defect — bite-proved in a hermetic tree: neutering the marker
      # test, making `backendPath` compose onto a null root, or narrowing the
      # dot-directory scan exclusion each exits 1 WITH the opt-in set and names
      # the failing assertion.
      - name: Repo path resolvers still resolve
        if: ${{ !cancelled() }}
        env:
          STREAMLINE_ALLOW_FRONTEND_ONLY: "1"
        run: pnpm run check:repo-paths:self-test

      # Root CLAUDE.md §9 says both repos are at zero circular dependencies and
      # that madge proves it. The BACKEND workflow has run `check:cycles` since
      # 35b; the frontend never has, so the claim was unenforced on the half with
      # 5,243 files. Measured here before wiring: rc=0, "No circular dependency
      # found!", 5,243 files processed in 13.5s. Blocking because it is green.
      - name: Import graph is acyclic
        if: ${{ !cancelled() }}
        run: pnpm run check:cycles

      # 2026-09-03 (ticket: test typecheck) — the frontend twin of the backend's
      # `check:test-typecheck`. `tsconfig.json` excludes `**/__tests__/**`,
      # `*.test.ts(x)` and `*.spec.ts(x)`, and `type-check` is a bare `tsc
      # --noEmit`, so the `type-check` job above has never compiled a single one
      # of this package's 338 test files. next/jest cannot substitute: it
      # transpiles through SWC, which erases types with no diagnostics switch, so
      # the `tests` job stays green over a spec calling a method that no longer
      # exists. MEASURED at head before wiring: 842 errors over 338 test files,
      # 703 of them one missing jest-dom type registration (fixed by putting
      # jest.setup.js in the program) and 139 genuine across 45 files. All 139
      # were fixed, so this is a HARD GATE at zero, not a ratchet.
      - name: Test files typecheck
        if: ${{ !cancelled() }}
        run: pnpm run check:test-typecheck:self-test && pnpm run check:test-typecheck

      # 2026-09-03 (ticket 35, box 5) — the frontend half of the backend's four
      # test-honesty gates (check:test-suppressions, check:vacuous-assertions,
      # check:bare-throw, check:transaction-callbacks). The frontend carried NONE
      # of them, on the recorded ground that it "measures 0 in every class". That
      # ground was WRONG: running the backend detector against this package found
      # two live COND_ASSERT tests in hooks/api/notifications-inbox.test.ts, both
      # behind `if (apiClient.get.mock.calls.length > 0)` — a guard on the very
      # fact each test exists to prove. Proved by EXECUTION: with both hooks
      # mutated to `enabled: false` so they never fetch, the pre-fix spec passed
      # 2/2. Repaired, then gated. MEASURED at head after the repair: rc=0, 346
      # test files, 2,722 test callbacks, 9,197 expect() calls, 24 .toThrow()
      # matchers -> all seven classes 0, all seven ratchets 0. A HARD ZERO, not a
      # ratchet, because the package genuinely measures zero. Four vacuity floors
      # exit 2 INCONCLUSIVE rather than 0 if the walk, the test-callback matcher,
      # the expect() matcher or the .toThrow() matcher measures nothing.
      - name: No frontend test is skipped, focused, or unable to fail
        if: ${{ !cancelled() }}
        run: pnpm run check:test-integrity:self-test && pnpm run check:test-integrity

      - name: Query keys and caches stay tenant-scoped
        if: ${{ !cancelled() }}
        run: pnpm run check:query-scope:self-test && pnpm run check:query-scope

      - name: Every queryFn forwards the abort signal
        if: ${{ !cancelled() }}
        run: pnpm run check:query-signal:self-test && pnpm run check:query-signal

      - name: Client contract has not drifted from the API (timesheets)
        if: ${{ !cancelled() }}
        run: pnpm run check:contract-drift:self-test && pnpm run check:contract-drift

      # CANNOT RUN IN CI — named prerequisite: a checkout of
      # Startupppp/streamlineos-backend beside this repository. Rule 1 of this
      # gate compares the manifest against the BACKEND module registry, so a
      # frontend-only half proves nothing about the rule the gate exists for.
      # MEASURED 2026-09-03: frontend-only checkout exit 2, "INCONCLUSIVE —
      # rule-1 (backend registry agreement) could not run"; two-repo layout at
      # the same commit exit 0. Allow-failure so the INCONCLUSIVE is visible in
      # the step list instead of skipping the 21 gates below it. It is
      # deliberately NOT given STREAMLINE_ALLOW_FRONTEND_ONLY=1: that would turn
      # a comparison that never happened into a green tick, which is the exact
      # defect this ticket exists to remove. To make it blocking, add a checkout
      # of the backend repository and set STREAMLINE_BACKEND_ROOT to it.
      - name: Module manifest agrees with the sidebar and vocabulary
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm run check:module-manifest:self-test && pnpm run check:module-manifest

      # CANNOT RUN IN CI — same named prerequisite as the step above. MEASURED
      # 2026-09-03: frontend-only checkout exit 2, "INCONCLUSIVE — the
      # manifest-vs-controller comparison — the entire point of this gate could
      # not run"; two-repo layout exit 0.
      - name: Home manifest agrees with the dashboard controller
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm run check:home-manifest:self-test && pnpm run check:home-manifest

      - name: Every route-access permission names a real endpoint
        if: ${{ !cancelled() }}
        run: pnpm run check:route-access-contract:self-test && pnpm run check:route-access-contract

      # BLOCKING AND CURRENTLY RED, deliberately. MEASURED 2026-09-03 at head in
      # both layouts: exit 1, 1,504 mutation hooks scanned, 4 above a baseline of
      # 0 — hooks/api/ai.ts:175 useGenerateJobDescription (UNCLASSIFIED, no
      # apiClient call in the hook body) and hooks/api/git-integration.ts:59/69/79
      # (WRONG-KEY: they declare "integrations:git:manage" where the contract
      # requires "settings:manage"). Those are real defects in frontend hook
      # territory, not gate noise; the gate is left blocking so they cannot be
      # merged past, and the baseline is deliberately NOT raised to absorb them.
      - name: Every mutation is classified as permissioned or self
        if: ${{ !cancelled() }}
        run: pnpm run check:command-catalog:self-test && pnpm run check:command-catalog

      # An authenticated layout without robots noindex inherits index:true from the root
      # layout, which is how three session-gated shells became crawlable.
      - name: Authenticated shells are noindex and public pages carry canonical metadata
        if: ${{ !cancelled() }}
        run: pnpm run check:seo-metadata:self-test && pnpm run check:seo-metadata

      - name: No arbitrary hex colour classes
        if: ${{ !cancelled() }}
        run: pnpm run check:colors:self-test && pnpm run check:colors

      # BLOCKING AND NEWLY RED, deliberately. 2026-09-03 (ticket 35) bite-proved
      # this gate and it did not bite: it reported "No useEffect-driven API
      # fetches found (5,278 files scanned)" over a real one, because both of
      # its rules needed a shape the common case does not have. With rule 3
      # added it measures ONE violation —
      # components/layout/command-palette.tsx:177, a debounced search calling
      # apiClient.get("/search") inside useEffect with a hand-rolled `cancelled`
      # flag instead of useQuery. Frontend component territory, not a gate
      # defect. The step is left blocking and red rather than muted: the code is
      # what is wrong, and `if: !cancelled()` above means a red step no longer
      # hides the ones after it.
      - name: No useEffect-driven API fetches
        if: ${{ !cancelled() }}
        run: pnpm run check:effect-fetches:self-test && pnpm run check:effect-fetches

      - name: No local Intl formatters outside lib/format-utils.ts
        if: ${{ !cancelled() }}
        run: pnpm run check:formatters:self-test && pnpm run check:formatters

      - name: Icon-only buttons carry an accessible name
        if: ${{ !cancelled() }}
        run: pnpm run check:icon-labels:self-test && pnpm run check:icon-labels

      - name: Client-page ratio stays within its ceiling
        if: ${{ !cancelled() }}
        run: pnpm run check:client-pages:self-test && pnpm run check:client-pages

      - name: Authenticated route modules stay thin
        if: ${{ !cancelled() }}
        run: pnpm run check:route-thinness:self-test && pnpm run check:route-thinness

      - name: No hand-rolled empty states
        if: ${{ !cancelled() }}
        run: pnpm run check:empty-states:self-test && pnpm run check:empty-states

      # Budgets only; no measurement runs in CI yet. Swap --self-test for --results=<file>
      # once a Lighthouse step produces one. See architecture-refactor/WEB-VITALS-EVIDENCE.md.
      - name: Web Vitals budgets are enforceable
        if: ${{ !cancelled() }}
        run: pnpm run check:web-vitals-budget:self-test

      # ---------------------------------------------------------------------
      # Reported, not blocking. Each of these has a MEASURED reason, recorded
      # 2026-09-02. Delete the continue-on-error when the named number is zero.
      # ---------------------------------------------------------------------

      # BLOCKING as of 2026-09-02. Re-measured after ticket 37's splits: rc=0,
      # 519 of 5228 production files exceed 300 lines against a baseline of 519 —
      # at the ratchet with no headroom, which is what a ratchet is for. The
      # workflow's own rule is to delete continue-on-error when the number is no
      # longer above the line, so it is deleted.
      - name: Files over 300 lines do not increase
        if: ${{ !cancelled() }}
        run: pnpm run check:over-300:self-test && pnpm run check:over-300

      # Measured rc=1: 3 files over 500 lines — features/hr/cases/cases-page-content.tsx
      # 501, hooks/api/notifications-inbox.ts 534, hooks/api/notifications-inbox.test.ts
      # 663. The third is newly visible: ticket 35 stopped this gate excluding
      # *.test.ts(x), because check-over-300 scanned them and this one did not, so
      # a 663-line test file inflated the 300-line ratchet while being exempt from
      # the 500-line ceiling. Measured both directions before choosing — exempting
      # tests from over-300 instead would have dropped 519 to 509 with no file
      # getting shorter, which is a ratchet moved to make a number smaller.
      # Aligning by tightening costs exactly one new row. §7 lists its exceptions
      # and tests are not among them. All three are other tickets' files.
      - name: Files over 500 lines
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm run check:file-sizes:self-test && pnpm run check:file-sizes

      # Ticket 36. The frontend half of the backend's `check:type-assertions`.
      # Hard zero for `as any` / `@ts-ignore` / `@ts-expect-error` / `@ts-nocheck`
      # in application code, and a zero-GROWTH ledger for `as unknown as` where
      # every file carries its count, its seam kind and a written invariant.
      # Generated output cannot enter the count: every directory whose name
      # begins `.next` is skipped, which is where the phantom "661 @ts-ignore"
      # came from. Measured at head: rc=0, 4,258 application files, 7 sites in
      # 6 files, 0 banned escapes.
      - name: Type assertions stay at a proven seam
        if: ${{ !cancelled() }}
        run: pnpm run check:type-assertions:self-test && pnpm run check:type-assertions

      # RE-MEASURED 2026-09-03 (ticket 35), hermetically at head in a
      # frontend-only checkout: rc=1, ONE unclassified export —
      # types/projects/shared.ts:PaginatedResponse. Baseline files=0 exports=0
      # and current files=0 exports=0, so the ratchet itself is clean; the
      # failure is the missing WIRE/KEEP verdict. The previous note here named
      # three exports (project-charts CHART_COLORS, mail-compose-sheet
      # MailComposeMode, media-image-schema MediaImageQuery) and all three are
      # gone — the number is one, and the step comment now says one.
      - name: Every export is classified and no classification is stale
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm run check:dead-code:self-test && pnpm run check:dead-code

      # RE-MEASURED 2026-09-03 (ticket 35): rc=1, 17 BREACHES — not the "6 routes
      # never measured" the previous note claimed. The measurement set landed
      # since, so these are measured bytes over declared ceilings, e.g.
      # /build/my-work measuredScriptBytes=817721 over 524288, /crm/leads
      # 807617 over 524288, /calendar 728786 over 524288, /chat
      # measuredPageChunkBytes=224885 over 204800. Real findings, ticket 22/26
      # territory. Still allow-failure because 17 is not zero.
      - name: Route bundle bytes stay within their declared ceiling
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm run check:route-bundle-budget:self-test && pnpm run check:route-bundle-budget

      # Measured rc=1: 1 business route handler, app/api/media/image/route.ts.
      # Root CLAUDE.md §5 permits only the NextAuth route. Real finding.
      - name: The only route.ts is NextAuth
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm run check:routes:self-test && pnpm run check:routes

      # The LIVE budget check, against the committed measurement set.
      # RE-MEASURED 2026-09-03 (ticket 35): rc=1, TWO breaches, both TTFB and
      # both carrying a recorded ticket-26 exception that the gate still counts
      # as a failure — mobile TTFB p95 932ms > 600 (was 3727) and desktop TTFB
      # p95 1669ms > 400 (was 1430). The mobile FCP breach the previous note
      # named is gone. Real findings, ticket 26/28. The self-test above stays
      # blocking; this reports the numbers.
      - name: Web Vitals budgets (measured)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm run check:web-vitals-budget

      # BLOCKING as of 2026-09-03 (ticket 35). The note here recorded rc=1 at
      # cross-feature-import 222/210 and shared-imports-feature 20/19. Both are
      # closed: S10 narrowed the corpus and lowered the cross-feature baseline
      # 210 -> 194 in the same change, and the org-switcher violation that made
      # the shared count 20 is gone. RE-MEASURED hermetically at head in a
      # frontend-only checkout: rc=0, shared-imports-feature 19/19 and
      # cross-feature-import 182/182, both AT the ratchet with no headroom.
      # This file's own rule is to delete continue-on-error when the number is no
      # longer above the line, so it is deleted.
      - name: Import direction (features -> shared, never the reverse)
        if: ${{ !cancelled() }}
        run: pnpm run check:import-direction:self-test && pnpm run check:import-direction

      # 2026-09-03 — these five gates existed in package.json and were referenced by NO
      # workflow, so they could never run. Two of them had already found real defects on the
      # day they were written (check:permission-binding: 27 permission/route mismatches;
      # check:response-contracts: the runtime-parsing ratchet). A gate that cannot run is
      # indistinguishable from a gate that passes, which is the defect class this release has
      # spent itself finding. `check:gate-wiring` below now makes recurrence impossible.
      - name: Gated reads consult a permission
        if: ${{ !cancelled() }}
        run: pnpm run check:gated-reads:self-test && pnpm run check:gated-reads

      - name: Handlers in JSX event props are named
        if: ${{ !cancelled() }}
        run: pnpm run check:named-handlers:self-test && pnpm run check:named-handlers

      - name: A hook gates on the permission its route declares
        if: ${{ !cancelled() }}
        run: pnpm run check:permission-binding:self-test && pnpm run check:permission-binding

      - name: Response contracts ratchet
        if: ${{ !cancelled() }}
        run: pnpm run check:response-contracts:self-test && pnpm run check:response-contracts

      - name: Component property conventions
        if: ${{ !cancelled() }}
        run: pnpm run check:properties

      - name: Every check:* script is wired into a workflow
        if: ${{ !cancelled() }}
        run: pnpm run check:gate-wiring

      # 2026-09-03 — the permission catalogue is now VENDORED as
      # contracts/permission-catalog.json, the same way contracts/openapi.json
      # vendors the API contract. Eight jest suites used to read the backend's
      # RBAC catalogue out of a sibling checkout that this workflow never clones;
      # measured on run 33719474880 the `tests` job reported 9 failed suites, 8
      # of them that cause, which meant the page-level RBAC gate had never once
      # been enforced in CI.
      #
      # A vendored copy that goes stale is worse than no copy, so this gate is
      # the load-bearing half and TWO of its three rules are hermetic:
      # rule 1 floors and shape, rule 2 cross-checks every `x-permission` in the
      # vendored OpenAPI contract against the catalogue. Both were bite-proved in
      # a frontend-only tree: dropping one route-bound permission exits 1 naming
      # it, and emptying the catalogue exits 1 — WITH the opt-in set, so the
      # opt-in cannot mask them. It downgrades only rule 3, the byte-for-byte
      # regeneration against the backend, which is reported PARTIAL here and
      # NOT RUN rather than silently skipped. To make rule 3 blocking, add a
      # checkout of Startupppp/streamlineos-backend and set STREAMLINE_BACKEND_ROOT.
      - name: Vendored permission catalogue is well-formed and agrees with the API contract
        if: ${{ !cancelled() }}
        env:
          STREAMLINE_ALLOW_FRONTEND_ONLY: "1"
        run: pnpm run check:permission-catalog:self-test && pnpm run check:permission-catalog

      # Compares frontend/contracts/openapi.json byte-for-byte against the
      # BACKEND repository's generated artifact. In a frontend-only checkout the
      # artifact does not resolve and the gate exits 1 by design — its own error
      # text says to skip it here and rely on check:contract-drift, which is
      # blocking above. To make this blocking, add a checkout of
      # Startupppp/streamlineos-backend and set STREAMLINEOS_BACKEND_ROOT to it.
      - name: Vendored contract is byte-identical to the backend artifact
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm run check:contract-vendor:self-test && pnpm run check:contract-vendor
