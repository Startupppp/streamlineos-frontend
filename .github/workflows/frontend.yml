name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - frontend/**
      - .github/workflows/frontend.yml
  pull_request:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type Check
        run: pnpm run type-check

      - name: Query keys and caches stay tenant-scoped
        run: pnpm run check:query-scope

      - name: Client contract has not drifted from the API (timesheets)
        run: pnpm run check:contract-drift:self-test && pnpm run check:contract-drift

      - name: Module manifest agrees with the sidebar and vocabulary
        run: pnpm run check:module-manifest:self-test && pnpm run check:module-manifest

      - name: Run Tests
        run: pnpm test --runInBand

      - name: Build
        run: pnpm run build
