name: Seeded E2E

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/seeded-e2e.yml
  pull_request:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/seeded-e2e.yml

jobs:
  seeded-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: streamlineos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d streamlineos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://user:password@localhost:5432/streamlineos
      APP_DATABASE_URL: postgres://streamline_app:ci-app-password@localhost:5432/streamlineos
      APP_DB_PASSWORD: ci-app-password
      PGSSLMODE: disable
      BACKEND_JWT_SECRET: ci-only-backend-jwt-secret-with-at-least-44-characters
      PORTAL_JWT_SECRET: ci-only-portal-jwt-secret-with-at-least-44-characters-xx
      ENCRYPTION_KEY: ci-only-encryption-key-min-32-characters-for-testing
      INTERNAL_API_SECRET: ci-only-internal-api-secret-min-32-chars-for-testing
      CORS_ORIGINS: http://localhost:1000
      APP_URL: http://localhost:1000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Bootstrap Database
        run: pnpm db:bootstrap

      - name: Create App Role
        run: pnpm db:bootstrap-role

      - name: Seeded Controller E2E Tests
        run: pnpm test:e2e:seeded
