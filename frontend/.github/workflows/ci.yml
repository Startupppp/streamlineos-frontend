name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm tsc --noEmit
        continue-on-error: false

      - name: Run linter
        run: pnpm lint
        continue-on-error: false

      - name: Import cycles
        run: pnpm check:cycles
        continue-on-error: false

      - name: Dead-code report
        run: pnpm exec knip --no-progress
        continue-on-error: true

      # Classifies knip's candidates against a module graph so a side-effect import, a dynamic
      # import, a re-export chain or a Next.js convention file is never mistaken for dead code.
      # Reported, not enforced, until tickets 30-33 land and the four confirmed dead files are
      # actually deleted — the count is above baseline today for reasons no single commit can fix.
      - name: Dead-code classification (reported)
        run: pnpm check:dead-code:self-test && pnpm check:dead-code
        continue-on-error: true

      # frontend/contracts/openapi.json is a hand-vendored copy of backend/openapi.json, so the
      # Timesheets drift check below can silently run against a stale contract. This fails when
      # the two diverge. It needs both repos checked out; skipped when the backend copy is absent.
      - name: Contract vendor copy is current
        run: pnpm check:contract-vendor:self-test && pnpm check:contract-vendor
        continue-on-error: true

      - name: Build application
        run: pnpm build
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-build-only-placeholder-not-a-real-secret-abc123' }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'http://localhost:3000' }}

      - name: CI complete
        if: success()
        run: echo "✅ Type check, lint, and build all passed."
