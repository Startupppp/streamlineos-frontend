<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Save to StreamlineOS</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <h1 class="title">Save to StreamlineOS</h1>

      <p id="status" class="status" role="status" aria-live="polite">Reading this page…</p>

      <form id="form" class="form" hidden>
        <label class="field">
          <span class="label">Name</span>
          <input id="fullName" name="fullName" type="text" maxlength="200" required />
        </label>

        <label class="field">
          <span class="label">Headline</span>
          <input id="headline" name="headline" type="text" maxlength="300" />
        </label>

        <div class="row">
          <label class="field">
            <span class="label">Company</span>
            <input id="currentCompany" name="currentCompany" type="text" maxlength="200" />
          </label>
          <label class="field">
            <span class="label">Location</span>
            <input id="location" name="location" type="text" maxlength="200" />
          </label>
        </div>

        <div class="row">
          <label class="field">
            <span class="label">Email</span>
            <input id="email" name="email" type="email" maxlength="200" />
          </label>
          <label class="field">
            <span class="label">Phone</span>
            <input id="phone" name="phone" type="text" maxlength="50" />
          </label>
        </div>

        <label class="field">
          <span class="label">Note</span>
          <textarea id="note" name="note" rows="2" maxlength="2000"></textarea>
        </label>

        <p class="profile-url" id="profileUrl"></p>

        <!--
          Unchecked on every open, never remembered. Consent is given for this
          person and this save; a box that stayed ticked from the last profile
          would be a setting, and a setting is not consent.
        -->
        <label class="consent">
          <input id="consent" name="consent" type="checkbox" />
          <span>
            I can see this information on this page and I am recording it to consider this person
            for a role. StreamlineOS will hold it as candidate personal data.
          </span>
        </label>

        <button id="save" class="save" type="submit" disabled>Save candidate</button>
      </form>

      <p id="result" class="result" hidden></p>
      <a id="settingsLink" class="settings-link" href="#">Settings</a>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
