<svg xmlns="http://www.w3.org/2000/svg" width="430" height="860" viewBox="0 0 430 860" role="img" aria-labelledby="title desc">
  <title id="title">StreamlineOS inventory mobile receiving reference</title>
  <desc id="desc">A compact one-handed receiving workflow that matches the existing StreamlineOS light UI system.</desc>
  <rect width="430" height="860" fill="#f8fafc"/>
  <g font-family="Geist, Arial, sans-serif" fill="#0b1220">
    <text x="24" y="40" font-size="12" fill="#64748b">INVENTORY / OPERATIONS</text>
    <text x="24" y="74" font-size="24" font-weight="700">Receiving</text>
    <circle cx="388" cy="64" r="18" fill="#ffffff" stroke="#e2e8f0"/><text x="380" y="70" font-size="16" fill="#0b1220">⋯</text>
    <rect x="24" y="98" width="382" height="48" rx="8" fill="#0b1220"/>
    <text x="48" y="128" font-size="14" font-weight="650" fill="#ffffff">Scan item</text><text x="356" y="128" font-size="18" fill="#D97706">⌁</text>
    <text x="24" y="178" font-size="11" fill="#64748b">PURCHASE ORDER</text><text x="24" y="200" font-size="14" font-weight="650">PO-2026-00481 · Acme Components</text>
    <rect x="24" y="226" width="382" height="246" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="48" y="258" font-size="11" fill="#64748b">MATCHED PRODUCT</text>
    <text x="48" y="291" font-size="18" font-weight="700">Steel fastener</text><text x="48" y="316" font-size="13" fill="#64748b">ST-220 · Box of 100</text>
    <rect x="48" y="342" width="334" height="42" rx="7" fill="#ecfdf5" stroke="#bbf7d0"/><circle cx="67" cy="363" r="7" fill="#16a34a"/><text x="84" y="368" font-size="12" fill="#166534" font-weight="650">Barcode matched · ready to receive</text>
    <text x="48" y="420" font-size="11" fill="#64748b">RECEIVE INTO</text><text x="48" y="446" font-size="14" font-weight="650">Bhiwandi A / A-04-18</text>
    <rect x="24" y="492" width="382" height="182" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="48" y="527" font-size="11" fill="#64748b">QUANTITY</text>
    <rect x="48" y="545" width="148" height="48" rx="7" fill="#f8fafc" stroke="#cbd5e1"/><text x="69" y="576" font-size="22" font-weight="700">240</text><text x="151" y="575" font-size="12" fill="#64748b">units</text>
    <text x="228" y="527" font-size="11" fill="#64748b">LOT / SERIAL</text><rect x="228" y="545" width="154" height="48" rx="7" fill="#ffffff" stroke="#cbd5e1"/><text x="245" y="575" font-size="13" fill="#64748b">LOT-240827</text>
    <text x="48" y="636" font-size="12" fill="#64748b">Expiry date</text><text x="132" y="636" font-size="12" font-weight="650">27 Aug 2027</text>
    <rect x="24" y="694" width="382" height="48" rx="8" fill="#0b1220"/><text x="147" y="724" font-size="14" fill="#ffffff" font-weight="650">Confirm receipt</text>
    <rect x="0" y="778" width="430" height="82" fill="#ffffff" stroke="#e2e8f0"/>
    <g font-size="11" text-anchor="middle"><circle cx="70" cy="806" r="10" fill="#fffbeb"/><text x="70" y="837" fill="#92400e">Scan</text><circle cx="215" cy="806" r="10" fill="#f1f5f9"/><text x="215" y="837" fill="#64748b">Tasks</text><circle cx="360" cy="806" r="10" fill="#f1f5f9"/><text x="360" y="837" fill="#64748b">Stock</text></g>
  </g>
</svg>
