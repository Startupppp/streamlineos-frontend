<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">StreamlineOS inventory desktop command center reference</title>
  <desc id="desc">A faithful light StreamlineOS inventory dashboard concept with existing shell, KPI cards, movement table, low stock queue, and an AI operations brief.</desc>
  <rect width="1440" height="900" fill="#f8fafc"/>
  <rect x="0" y="0" width="224" height="900" fill="#ffffff"/>
  <line x1="224" y1="0" x2="224" y2="900" stroke="#e2e8f0"/>
  <g font-family="Geist, Arial, sans-serif" fill="#0b1220">
    <text x="28" y="42" font-size="19" font-weight="700">StreamlineOS</text>
    <text x="28" y="77" font-size="11" fill="#64748b">WORKSPACE</text>
    <rect x="20" y="92" width="184" height="38" rx="8" fill="#f1f5f9"/>
    <circle cx="39" cy="111" r="10" fill="#0b1220"/>
    <text x="57" y="115" font-size="13" font-weight="600">Acme Distribution</text>
    <text x="28" y="171" font-size="11" fill="#64748b">INVENTORY</text>
    <rect x="16" y="187" width="192" height="38" rx="8" fill="#0b1220"/>
    <circle cx="36" cy="206" r="7" fill="#D97706"/>
    <text x="55" y="211" font-size="13" fill="#ffffff" font-weight="600">Dashboard</text>
    <text x="28" y="262" font-size="13" fill="#64748b">Products</text>
    <text x="28" y="302" font-size="13" fill="#64748b">Stock</text>
    <text x="28" y="342" font-size="13" fill="#64748b">Warehouses</text>
    <text x="28" y="382" font-size="13" fill="#64748b">Purchase Orders</text>
    <text x="28" y="422" font-size="13" fill="#64748b">Operations</text>
    <text x="28" y="462" font-size="13" fill="#64748b">Reports</text>
    <text x="28" y="502" font-size="13" fill="#64748b">Quality</text>
    <line x1="28" y1="820" x2="196" y2="820" stroke="#e2e8f0"/>
    <circle cx="40" cy="850" r="14" fill="#e0f2fe"/>
    <text x="64" y="855" font-size="12" font-weight="600">Tarun C.</text>
    <text x="64" y="871" font-size="10" fill="#64748b">Owner</text>

    <text x="264" y="48" font-size="24" font-weight="650">Inventory Dashboard</text>
    <text x="264" y="73" font-size="13" fill="#64748b">Track stock levels, movements, and reorder alerts.</text>
    <rect x="1241" y="28" width="130" height="36" rx="7" fill="#0b1220"/>
    <text x="1270" y="51" font-size="12" fill="#ffffff" font-weight="600">+ Add Product</text>

    <g transform="translate(264 108)">
      <rect width="252" height="104" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="18" y="28" font-size="11" fill="#64748b">TOTAL SKUs</text>
      <text x="18" y="66" font-size="28" font-weight="700">12,480</text>
      <circle cx="217" cy="32" r="16" fill="#eff6ff"/><text x="210" y="38" font-size="14" fill="#1d4ed8">▦</text>
    </g>
    <g transform="translate(532 108)">
      <rect width="252" height="104" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="18" y="28" font-size="11" fill="#64748b">TOTAL ON HAND</text>
      <text x="18" y="66" font-size="28" font-weight="700">84,209</text>
      <circle cx="217" cy="32" r="16" fill="#ecfdf5"/><text x="209" y="38" font-size="14" fill="#047857">↗</text>
    </g>
    <g transform="translate(800 108)">
      <rect width="252" height="104" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="18" y="28" font-size="11" fill="#64748b">LOW STOCK ITEMS</text>
      <text x="18" y="66" font-size="28" font-weight="700">37</text>
      <circle cx="217" cy="32" r="16" fill="#fffbeb"/><text x="209" y="38" font-size="14" fill="#b45309">!</text>
    </g>
    <g transform="translate(1068 108)">
      <rect width="303" height="104" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="18" y="28" font-size="11" fill="#64748b">STOCK VALUE</text>
      <text x="18" y="66" font-size="28" font-weight="700">₹48.6M</text>
      <text x="207" y="65" font-size="11" fill="#047857">+8.4%</text>
    </g>

    <rect x="264" y="236" width="1107" height="54" rx="9" fill="#fffbeb" stroke="#fde68a"/>
    <circle cx="284" cy="263" r="6" fill="#D97706"/>
    <text x="301" y="267" font-size="12" font-weight="650" fill="#92400e">Attention needed:</text>
    <rect x="426" y="248" width="128" height="28" rx="6" fill="#ffffff" stroke="#fde68a"/><text x="440" y="266" font-size="11" fill="#92400e">12 expiring lots</text>
    <rect x="565" y="248" width="151" height="28" rx="6" fill="#ffffff" stroke="#fde68a"/><text x="579" y="266" font-size="11" fill="#92400e">4 quality holds</text>
    <rect x="727" y="248" width="156" height="28" rx="6" fill="#ffffff" stroke="#fecaca"/><text x="741" y="266" font-size="11" fill="#b91c1c">3 failed syncs</text>

    <rect x="264" y="314" width="697" height="308" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="284" y="348" font-size="14" font-weight="650">Recent Movements</text>
    <text x="864" y="348" font-size="11" fill="#64748b">View all →</text>
    <line x1="284" y1="370" x2="941" y2="370" stroke="#e2e8f0"/>
    <text x="284" y="394" font-size="10" fill="#64748b">DATE</text><text x="382" y="394" font-size="10" fill="#64748b">PRODUCT</text><text x="600" y="394" font-size="10" fill="#64748b">TYPE</text><text x="726" y="394" font-size="10" fill="#64748b">QTY</text><text x="810" y="394" font-size="10" fill="#64748b">LOCATION</text>
    <g font-size="11">
      <text x="284" y="428" fill="#64748b">Aug 27, 10:42</text><text x="382" y="428" font-weight="600">Packaging box · BX-104</text><rect x="600" y="413" width="62" height="22" rx="5" fill="#ecfdf5" stroke="#bbf7d0"/><text x="612" y="428" fill="#047857">Receipt</text><text x="726" y="428" fill="#047857" font-weight="650">+240</text><text x="810" y="428" fill="#64748b">Bhiwandi A</text>
      <line x1="284" y1="448" x2="941" y2="448" stroke="#f1f5f9"/>
      <text x="284" y="478" fill="#64748b">Aug 27, 09:18</text><text x="382" y="478" font-weight="600">Steel fastener · ST-220</text><rect x="600" y="463" width="62" height="22" rx="5" fill="#fef2f2" stroke="#fecaca"/><text x="615" y="478" fill="#b91c1c">Sale</text><text x="726" y="478" fill="#b91c1c" font-weight="650">−84</text><text x="810" y="478" fill="#64748b">Pune DC</text>
      <line x1="284" y1="498" x2="941" y2="498" stroke="#f1f5f9"/>
      <text x="284" y="528" fill="#64748b">Aug 27, 08:56</text><text x="382" y="528" font-weight="600">Safety gloves · GL-018</text><rect x="600" y="513" width="62" height="22" rx="5" fill="#eff6ff" stroke="#bfdbfe"/><text x="609" y="528" fill="#1d4ed8">Transfer</text><text x="726" y="528" fill="#047857" font-weight="650">+120</text><text x="810" y="528" fill="#64748b">Delhi Hub</text>
      <line x1="284" y1="548" x2="941" y2="548" stroke="#f1f5f9"/>
      <text x="284" y="578" fill="#64748b">Aug 26, 17:32</text><text x="382" y="578" font-weight="600">Adhesive tape · AT-440</text><rect x="600" y="563" width="62" height="22" rx="5" fill="#fffbeb" stroke="#fde68a"/><text x="610" y="578" fill="#92400e">Adjust</text><text x="726" y="578" fill="#b91c1c" font-weight="650">−12</text><text x="810" y="578" fill="#64748b">Mumbai B</text>
    </g>

    <rect x="985" y="314" width="386" height="308" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="1007" y="348" font-size="14" font-weight="650">Low Stock Alerts</text><text x="1274" y="348" font-size="11" fill="#64748b">View all →</text>
    <line x1="1007" y1="370" x2="1349" y2="370" stroke="#e2e8f0"/>
    <g font-size="11">
      <circle cx="1017" cy="404" r="5" fill="#dc2626"/><text x="1032" y="399" font-weight="650">Steel fastener</text><text x="1032" y="417" fill="#64748b">ST-220 · On hand 18</text><text x="1311" y="408" fill="#b91c1c" font-weight="650">Critical</text>
      <line x1="1007" y1="438" x2="1349" y2="438" stroke="#f1f5f9"/>
      <circle cx="1017" cy="472" r="5" fill="#D97706"/><text x="1032" y="467" font-weight="650">Adhesive tape</text><text x="1032" y="485" fill="#64748b">AT-440 · On hand 42</text><text x="1311" y="476" fill="#92400e" font-weight="650">High</text>
      <line x1="1007" y1="506" x2="1349" y2="506" stroke="#f1f5f9"/>
      <circle cx="1017" cy="540" r="5" fill="#3b82f6"/><text x="1032" y="535" font-weight="650">Safety gloves</text><text x="1032" y="553" fill="#64748b">GL-018 · On hand 84</text><text x="1311" y="544" fill="#1d4ed8" font-weight="650">Medium</text>
    </g>

    <rect x="264" y="646" width="1107" height="174" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="294" cy="682" r="16" fill="#fffbeb"/><text x="286" y="688" font-size="16" fill="#D97706">✦</text>
    <text x="322" y="680" font-size="14" font-weight="650">AI operations brief</text><text x="322" y="700" font-size="11" fill="#64748b">Generated from current inventory signals · review before acting</text>
    <rect x="1221" y="665" width="128" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="1241" y="685" font-size="11" font-weight="600">Generate brief</text>
    <text x="284" y="744" font-size="13" fill="#334155">Three items are below their reorder threshold, with the steel fastener carrying the highest stockout risk.</text>
    <text x="284" y="768" font-size="13" fill="#334155">One supplier delivery is overdue and 12 lots need expiry review within the next 30 days.</text>
    <rect x="284" y="786" width="126" height="22" rx="5" fill="#fffbeb" stroke="#fde68a"/><text x="296" y="801" font-size="10" fill="#92400e">3 stockout risks</text>
    <rect x="420" y="786" width="122" height="22" rx="5" fill="#fffbeb" stroke="#fde68a"/><text x="432" y="801" font-size="10" fill="#92400e">12 expiry risks</text>
    <rect x="552" y="786" width="130" height="22" rx="5" fill="#fef2f2" stroke="#fecaca"/><text x="564" y="801" font-size="10" fill="#b91c1c">1 vendor delay</text>
  </g>
</svg>
